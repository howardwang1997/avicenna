[project]
name = "avicenna"
version = "0.1.0"
description = "PDF to Markdown preprocessing tool for ski instruction manuals"
requires-python = ">=3.10"
dependencies = [
    "mineru>=2.7",
    "langchain-openai>=1.1",
    "langchain-core>=1.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "Pillow>=10.0",
]

[project.scripts]
avicenna = "avicenna.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
